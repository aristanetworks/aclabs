---
# ANTA validation via the arista.avd.anta_runner role (AVD 6.3): the
# auto-generated catalogs from avd/intended/structured_configs/, reports in
# avd/anta/reports/.
#
# Dry-run (generate everything, connect to nothing):
#   ansible-playbook avd/playbooks/validate.yml -i avd/inventory.yml \
#     -e target_hosts=DOMAIN_C_FABRIC -e anta_dry_run=true
- name: Validate Fabric with ANTA
  hosts: "{{ target_hosts }}"
  gather_facts: false
  connection: local

  tasks:
    - name: Run the ANTA workflow (AVD auto-catalogs)
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_runner_dry_run: "{{ anta_dry_run | default(false) | bool }}"
