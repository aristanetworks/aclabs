---
# Inventory — techlib EVPN-VXLAN Deployment Guide, Domains C + D + Backbone
#
# Three AVD fabrics (each built with its own play — fabric_name must be
# uniform per play):
#   DOMAIN_C_FABRIC — IPv6 link-local eBGP underlay + eBGP EVPN, MLAG leafs
#                     with Multi-VTEP MLAG and IPv4 OISM, All-Active Gateway
#   DOMAIN_D_FABRIC — IPv6 link-local iBGP underlay + iBGP EVPN (spine RRs),
#                     EVPN All-Active multihoming everywhere, All-Active Gateway
#   BACKBONE        — BB1/BB2: IPv6 IS-IS SR-MPLS transport + EVPN-MPLS
#                     route reflectors for the four Gateways
#
# The role groups (SPINES / LEAFS / GATEWAYS / L2_SWITCHES) carry only the
# AVD node `type`; role behaviour (OISM on/off, the MLAG peering, ...) lives
# in group_vars/<ROLE>.yml — vars set inside the inventory file rank BELOW
# group_vars files in Ansible's precedence, so they cannot override a
# fabric-level setting.
#
# DCI groups the three fabrics' Gateway/Backbone nodes so the inter-domain
# point-to-point links are defined exactly once (group_vars/DCI.yml).

all:
  children:

    DOMAIN_C_FABRIC:
      children:
        DOMAIN_C_SPINES:
          vars:
            type: spine
          hosts:
            C-SPINE1:
            C-SPINE2:
            C-SPINE3:
            C-SPINE4:
        DOMAIN_C_LEAFS:
          vars:
            type: l3leaf
          hosts:
            C-LEAF1:
            C-LEAF2:
            C-LEAF3:
            C-LEAF4:
            C-LEAF5:
            C-LEAF6:
        DOMAIN_C_GATEWAYS:
          vars:
            type: l3leaf
          hosts:
            C-LEAF7:
            C-LEAF8:

    DOMAIN_D_FABRIC:
      children:
        DOMAIN_D_SPINES:
          vars:
            type: spine
          hosts:
            D-SPINE1:
            D-SPINE2:
            D-SPINE3:
            D-SPINE4:
        DOMAIN_D_LEAFS:
          vars:
            type: l3leaf
          hosts:
            D-LEAF1:
            D-LEAF2:
            D-LEAF3:
            D-LEAF4:
            D-LEAF5:
            D-LEAF6:
        DOMAIN_D_GATEWAYS:
          vars:
            type: l3leaf
          hosts:
            D-LEAF7:
            D-LEAF8:
        DOMAIN_D_L2_SWITCHES:
          vars:
            type: l2leaf
          hosts:
            D-SW1:

    BACKBONE:
      vars:
        type: spine
      hosts:
        BB1:
        BB2:

    DCI:
      children:
        DOMAIN_C_GATEWAYS:
        DOMAIN_D_GATEWAYS:
        BACKBONE:
