---
# The nine inter-domain point-to-point links, defined once for the three
# fabrics (each node renders its own end). IPv6 numbered, IS-IS BACKBONE
# point-to-point on both ends.
#
#   2001:db8:bb<n>:<gw>::<host>/64 — the host suffix carries the node name
#   (bb1 / c7 / d8 ...), so `show ipv6 route` reads like the diagram.
#
# `include_in_underlay_protocol: false` on purpose: the Gateway ends belong
# to fabrics whose underlay is not IS-IS, and AVD refuses IPv6 p2p links in
# the underlay protocol outside ISIS-SR. The IS-IS interface config is
# therefore structured config on the profile — it lands on both ends of
# every link (BB1/BB2 and the four Gateways alike).

l3_edge:
  p2p_links_profiles:
    - name: DCI
      mtu: 9214
      include_in_underlay_protocol: false
      mpls_ip: false        # the guide enables MPLS globally (`mpls ip`), not per interface
      ethernet_structured_config:
        ipv6_enable: true
        isis_enable: BACKBONE
        isis_network_point_to_point: true

  p2p_links:
    - nodes: [C-LEAF7, BB1]
      interfaces: [Ethernet7, Ethernet1]
      ipv6: [2001:db8:bb1:c7::c7/64, 2001:db8:bb1:c7::bb1/64]
      profile: DCI
    - nodes: [C-LEAF8, BB1]
      interfaces: [Ethernet7, Ethernet2]
      ipv6: [2001:db8:bb1:c8::c8/64, 2001:db8:bb1:c8::bb1/64]
      profile: DCI
    - nodes: [C-LEAF7, BB2]
      interfaces: [Ethernet8, Ethernet1]
      ipv6: [2001:db8:bb2:c7::c7/64, 2001:db8:bb2:c7::bb2/64]
      profile: DCI
    - nodes: [C-LEAF8, BB2]
      interfaces: [Ethernet8, Ethernet2]
      ipv6: [2001:db8:bb2:c8::c8/64, 2001:db8:bb2:c8::bb2/64]
      profile: DCI

    - nodes: [D-LEAF7, BB1]
      interfaces: [Ethernet7, Ethernet3]
      ipv6: [2001:db8:bb1:d7::d7/64, 2001:db8:bb1:d7::bb1/64]
      profile: DCI
    - nodes: [D-LEAF8, BB1]
      interfaces: [Ethernet7, Ethernet4]
      ipv6: [2001:db8:bb1:d8::d8/64, 2001:db8:bb1:d8::bb1/64]
      profile: DCI
    - nodes: [D-LEAF7, BB2]
      interfaces: [Ethernet8, Ethernet3]
      ipv6: [2001:db8:bb2:d7::d7/64, 2001:db8:bb2:d7::bb2/64]
      profile: DCI
    - nodes: [D-LEAF8, BB2]
      interfaces: [Ethernet8, Ethernet4]
      ipv6: [2001:db8:bb2:d8::d8/64, 2001:db8:bb2:d8::bb2/64]
      profile: DCI

    - nodes: [BB1, BB2]
      interfaces: [Ethernet5, Ethernet5]
      ipv6: [2001:db8:bb1:bb2::bb1/64, 2001:db8:bb1:bb2::bb2/64]
      profile: DCI
