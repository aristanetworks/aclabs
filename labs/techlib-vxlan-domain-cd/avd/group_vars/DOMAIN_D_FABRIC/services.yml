---

standard_vlan_redistribute:
  redistribute_routes:
    - learned
    - router-mac next-hop vtep primary
    - router-mac virtual-ip next-hop vtep primary

svi_profiles:
  - profile: TENANT_SVI
    enabled: true
    mtu: 9014
    bgp:
      structured_config: "{{ standard_vlan_redistribute if standard_leaf else {} }}"

tenants:
  - name: DOMAIN_D
    mac_vrf_vni_base: 10000
    vrfs:
      - name: PROD
        vrf_vni: 50001
        bgp:
          structured_config:
            updates:
              wait_install: true
        svis:
          - id: 10
            name: Blue
            tags: [BLUE]
            profile: TENANT_SVI
            ip_address_virtual: 10.10.10.1/24
          - id: 20
            name: Green
            tags: [GREEN]
            profile: TENANT_SVI
            evpn_l2_multi_domain: false
            ip_address_virtual: 10.20.20.1/24
          - id: 40
            name: Purple
            tags: [PURPLE]
            profile: TENANT_SVI
            evpn_l2_multi_domain: false
            ip_address_virtual: 10.40.40.1/24

      - name: DEV
        vrf_vni: 50002
        bgp:
          structured_config:
            updates:
              wait_install: true
        svis:
          - id: 60
            name: Red
            tags: [RED]
            profile: TENANT_SVI
            evpn_l2_multi_domain: false
            ip_address_virtual: 10.60.60.1/24
          - id: 70
            name: Brown
            tags: [BROWN]
            profile: TENANT_SVI
            ip_address_virtual: 10.70.70.1/24
          - id: 80
            name: Black
            tags: [BLACK]
            profile: TENANT_SVI
            evpn_l2_multi_domain: false
            ip_address_virtual: 10.80.80.1/24
