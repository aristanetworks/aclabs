---
custom_node_type_keys:

  - key: core
    type: core
    connected_endpoints: false
    mlag_support: false
    network_services:
      l2: false
      l3: true
    default_overlay_routing_protocol: none
    default_underlay_routing_protocol: ebgp

type: core
fabric_name: CORE

core:
  defaults:
    platform: frr
    loopback_ipv4_pool: 10.251.1.0/24
    bgp_as: 65000
  nodes:
    - name: frr-core1
      id: 1
      mgmt_ip: 192.168.0.250/24
    # - name: frr-core2
    #   id: 2
    #   mgmt_ip: 192.168.0.11/24
