---
- name: Preview or deploy FRR configuration on the Containerlab host
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/frr.yml
  vars:
    frr_apply: false

  tasks:
    - name: Copy the generated configuration into the running FRR container
      ansible.builtin.command:
        argv: [docker, cp, "{{ frr_config_file }}", "{{ frr_node }}:/tmp/frr-intended.conf"]
      changed_when: true

    - name: Preview additions and removals using the FRR reload utility
      ansible.builtin.command:
        argv: [docker, exec, -u, root, "{{ frr_node }}", /usr/lib/frr/frr-reload.py, --test, /tmp/frr-intended.conf]
      register: frr_preview
      changed_when: false
      no_log: true

    - name: Show the preview with BGP passwords removed
      ansible.builtin.debug:
        msg: "{{ frr_preview.stdout | regex_replace('(?m)^(.*neighbor\\s+\\S+\\s+password).*$', '\\1 <removed>') }}"

    - name: Apply and save the intended FRR configuration
      when: frr_apply | bool
      block:
        - name: Reconcile the running configuration including removed commands
          ansible.builtin.command:
            argv: [docker, exec, -u, root, "{{ frr_node }}", /usr/lib/frr/frr-reload.py, --reload, /tmp/frr-intended.conf]
          changed_when: true
          no_log: true

        - name: Save the FRR running configuration
          ansible.builtin.command:
            argv: [docker, exec, -u, root, "{{ frr_node }}", vtysh, -c, write memory]
          changed_when: true
