---
- name: Deploy the rendered FRR configuration
  hosts: "{{ target_hosts | default('CORE') }}"
  gather_facts: false
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: root

  tasks:

    - name: Push FRR Configuration
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/intended/configs/{{ inventory_hostname }}.cfg"
        dest: /etc/frr/frr.conf
        owner: frr
        group: frr
        mode: '0640'
      register: frr_config
      notify: Reload FRR configuration

  handlers:
    - name: Reload FRR configuration
      ansible.builtin.command:
        argv:
          - /usr/lib/frr/frr-reload.py
          - --reload
          - /etc/frr/frr.conf
      changed_when: true
