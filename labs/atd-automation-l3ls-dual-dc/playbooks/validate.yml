---
- name: Validate Network State
  hosts: "{{ target_hosts }}"
  connection: httpapi
  gather_facts: false

  tasks:

    - name: validate states on EOS devices
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        user_catalogs_enabled: true
        anta_report_expand_results: true
