---
- name: Build FRR transport from AVD intended configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/frr.yml

  tasks:
    - name: Read Containerlab topology
      ansible.builtin.include_vars:
        file: "{{ frr_project_dir }}/clab/topology.clab.yml"
        name: frr_topology

    - name: Read Containerlab to EOS interface mapping
      ansible.builtin.include_vars:
        file: "{{ frr_project_dir }}/clab/interfaces.json"
        name: frr_interface_mapping

    - name: Start with an empty FRR data model
      ansible.builtin.set_fact:
        frr_peers: []
        frr_asns: []
        frr_subnets: []
        frr_peer_summaries: []
      no_log: true

    - name: Translate each AVD border handoff into an FRR peer
      ansible.builtin.include_tasks: tasks/frr_peer.yml
      loop: "{{ frr_border_configs }}"
      loop_control:
        loop_var: frr_border_file
        label: "{{ frr_border_file | basename }}"

    - name: Check that the data model covers every FRR link exactly once
      ansible.builtin.assert:
        that:
          - frr_peers | length > 0
          - frr_asns | unique | length == 1
          - frr_peers | map(attribute='interface') | unique | length == frr_peers | length
          - >-
            frr_peers | map(attribute='endpoint') | sort ==
            frr_topology.topology.links | map(attribute='endpoints') | flatten
            | select('match', frr_node ~ ':') | sort
        fail_msg: Every FRR cable needs one peer, a unique interface, and the same FRR ASN.

    - name: Collect the FRR ASN and the allowed gateway routes
      ansible.builtin.set_fact:
        frr_asn: "{{ frr_asns | first }}"
        frr_prefixes: "{{ frr_peers | map(attribute='prefixes') | flatten | unique | sort }}"

    - name: Show the multivendor handoffs without authentication secrets
      ansible.builtin.debug:
        msg:
          router: "{{ frr_node }}"
          local_as: "{{ frr_asn }}"
          handoffs: "{{ frr_peer_summaries }}"
          allowed_routes: "{{ frr_prefixes }}"

    - name: Create the local FRR artifact directory
      ansible.builtin.file:
        path: "{{ frr_output_dir }}"
        state: directory
        mode: '0755'

    - name: Render FRR configuration using the translated AVD data
      ansible.builtin.template:
        src: ../templates/frr.conf.j2
        dest: "{{ frr_config_file }}"
        mode: '0600'
      register: frr_render
      # The generated FRR syntax contains the cleartext BGP authentication key.
      diff: false
      no_log: true
