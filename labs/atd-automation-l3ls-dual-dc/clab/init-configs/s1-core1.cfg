no aaa root
!
username arista privilege 15 role network-admin secret arista
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s1-core1
dns domain atd.lab
!
spanning-tree mode mstp
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
vlan 1000
   name dci
!
vrf instance MGMT
!
aaa authorization exec default local
!
interface Ethernet1
   shutdown
!
interface Ethernet2
   switchport
   switchport mode access
   switchport access vlan 1000
!
interface Ethernet3
   shutdown
!
interface Ethernet4
   switchport
   switchport mode access
   switchport access vlan 1000
!
interface Ethernet6
   shutdown
!
interface Management1
   vrf MGMT
   ip address 192.168.0.102/24
!
ip routing
no ip routing vrf MGMT
!
ntp server time.apple.com source Management1
ntp server time.google.com source Management1
ntp server time.windows.com source Management1
!
end