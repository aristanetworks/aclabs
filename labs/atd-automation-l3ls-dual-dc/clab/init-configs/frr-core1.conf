! Preconfigured IPv4 DCI transport for the dual-DC workshop.
! Border addresses and ASNs match the l3_edge exercise in global_vars.
! Lab-only BGP keys match the EOS IPv4-UNDERLAY-PEERS peer group.
frr defaults traditional
hostname frr-core1
log stdout informational
service integrated-vtysh-config
!
interface eth1
 description s1-brdr1_Ethernet4
 ip address 172.16.255.1/31
 ip mtu 1500
 no shutdown
exit
!
interface eth2
 description s1-brdr2_Ethernet4
 ip address 172.16.255.3/31
 ip mtu 1500
 no shutdown
exit
!
interface eth3
 description s2-brdr1_Ethernet4
 ip address 172.16.255.5/31
 ip mtu 1500
 no shutdown
exit
!
interface eth4
 description s2-brdr2_Ethernet4
 ip address 172.16.255.7/31
 ip mtu 1500
 no shutdown
exit
!
ip prefix-list DCI-OUT seq 10 permit 10.250.1.7/32
ip prefix-list DCI-OUT seq 20 permit 10.250.1.8/32
ip prefix-list DCI-OUT seq 30 permit 10.250.2.7/32
ip prefix-list DCI-OUT seq 40 permit 10.250.2.8/32
ip prefix-list DCI-OUT seq 50 permit 10.255.1.7/32
ip prefix-list DCI-OUT seq 60 permit 10.255.2.7/32
!
ip prefix-list FROM-s1-brdr1 seq 10 permit 10.250.1.7/32
ip prefix-list FROM-s1-brdr1 seq 20 permit 10.255.1.7/32
route-map FROM-s1-brdr1 permit 10
 match ip address prefix-list FROM-s1-brdr1
exit
!
ip prefix-list FROM-s1-brdr2 seq 10 permit 10.250.1.8/32
ip prefix-list FROM-s1-brdr2 seq 20 permit 10.255.1.7/32
route-map FROM-s1-brdr2 permit 10
 match ip address prefix-list FROM-s1-brdr2
exit
!
ip prefix-list FROM-s2-brdr1 seq 10 permit 10.250.2.7/32
ip prefix-list FROM-s2-brdr1 seq 20 permit 10.255.2.7/32
route-map FROM-s2-brdr1 permit 10
 match ip address prefix-list FROM-s2-brdr1
exit
!
ip prefix-list FROM-s2-brdr2 seq 10 permit 10.250.2.8/32
ip prefix-list FROM-s2-brdr2 seq 20 permit 10.255.2.7/32
route-map FROM-s2-brdr2 permit 10
 match ip address prefix-list FROM-s2-brdr2
exit
!
route-map DCI-OUT permit 10
 match ip address prefix-list DCI-OUT
exit
!
router bgp 65000
 bgp router-id 192.168.0.250
 no bgp default ipv4-unicast
 neighbor 172.16.255.0 remote-as 65103
 neighbor 172.16.255.0 description s1-brdr1
 neighbor 172.16.255.0 password arista
 neighbor 172.16.255.0 bfd
 neighbor 172.16.255.2 remote-as 65103
 neighbor 172.16.255.2 description s1-brdr2
 neighbor 172.16.255.2 password arista
 neighbor 172.16.255.2 bfd
 neighbor 172.16.255.4 remote-as 65203
 neighbor 172.16.255.4 description s2-brdr1
 neighbor 172.16.255.4 password arista
 neighbor 172.16.255.4 bfd
 neighbor 172.16.255.6 remote-as 65203
 neighbor 172.16.255.6 description s2-brdr2
 neighbor 172.16.255.6 password arista
 neighbor 172.16.255.6 bfd
 !
 address-family ipv4 unicast
  neighbor 172.16.255.0 activate
  neighbor 172.16.255.0 route-map FROM-s1-brdr1 in
  neighbor 172.16.255.0 route-map DCI-OUT out
  neighbor 172.16.255.2 activate
  neighbor 172.16.255.2 route-map FROM-s1-brdr2 in
  neighbor 172.16.255.2 route-map DCI-OUT out
  neighbor 172.16.255.4 activate
  neighbor 172.16.255.4 route-map FROM-s2-brdr1 in
  neighbor 172.16.255.4 route-map DCI-OUT out
  neighbor 172.16.255.6 activate
  neighbor 172.16.255.6 route-map FROM-s2-brdr2 in
  neighbor 172.16.255.6 route-map DCI-OUT out
  maximum-paths 2
 exit-address-family
exit
!
bfd
 peer 172.16.255.0 local-address 172.16.255.1 interface eth1
 exit
 peer 172.16.255.2 local-address 172.16.255.3 interface eth2
 exit
 peer 172.16.255.4 local-address 172.16.255.5 interface eth3
 exit
 peer 172.16.255.6 local-address 172.16.255.7 interface eth4
 exit
exit
!
