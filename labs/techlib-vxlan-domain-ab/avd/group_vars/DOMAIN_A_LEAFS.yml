---
# Domain A standard leafs (A-LEAF1..6) — role settings.
#
# `standard_leaf` gates the OISM/Multi-VTEP additions that have no AVD 6.3
# model (see DOMAIN_A_FABRIC/services.yml and fabric.yml).
standard_leaf: true

# The OISM PIM/IGMP source loopbacks are allocated per pod
# (vtep_diagnostic.loopback_ip_pools); the Gateway pair has no pod entry and
# therefore gets none.
pod_name: A-LEAFS

# AVD adds `software-forwarding sfe` under `router multicast` on every OISM
# node; the guide's lab does not run it. Removed so the multicast data plane
# matches what the guide validated.
custom_structured_configuration_router_multicast:
  ipv4:
    software_forwarding: null

# VTEP additions that exist only on the MLAG/OISM leafs (the Gateway pair has
# neither a shared VTEP nor OISM):
#   * the pair's shared Multi-VTEP source (address per pod in fabric.yml)
#   * IPv6 OISM on the VTEP — no AVD 6.3 key
custom_structured_configuration_vxlan_interface:
  vxlan1:
    vxlan:
      mlag_source_interface: Loopback2
    eos_cli: vxlan multicast ipv6
