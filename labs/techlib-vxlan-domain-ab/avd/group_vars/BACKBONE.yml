---

fabric_name: BACKBONE

underlay_routing_protocol: none
overlay_routing_protocol: ibgp
bgp_as: '65000'
bgp_update_wait_install: false

dns_settings:
  servers:
    - ip_address: 8.8.8.8
      vrf: use_mgmt_interface_vrf
  set_source_interfaces: false
ntp_settings: null
timezone: null
event_monitor: null
source_interfaces: null

custom_structured_configuration_interface_defaults:
  mtu: 9214

custom_structured_configuration_management_ssh:
  vrfs:
    - name: MGMT
      enable: true

custom_structured_configuration_peer_filters:
  - name: DC-ASN-RANGE
    sequence_numbers:
      - sequence: 10
        match: as-range 65100-65499 result accept

spine:
  defaults:
    platform: cEOSLab
    loopback_ipv4_pool: 10.0.0.0/24
    bgp_cluster_id: 10.0.0.0
    structured_config:
      spanning_tree:
        mode: mstp
      router_bgp:
        listen_ranges:
          - prefix: 10.0.0.0/8
            peer_group: EVPN-GW-PEERS
            remote_as: '65000'
          - prefix: 172.16.0.0/16
            peer_group: IP-TRANSPORT-CLIENTS
            peer_filter: DC-ASN-RANGE
        peer_groups:
          - name: EVPN-GW-PEERS
            next_hop_unchanged: true
            update_source: Loopback0
            bfd: true
            route_reflector_client: true
          - name: IP-TRANSPORT-CLIENTS
            route_reflector_client: true
        address_family_evpn:
          peer_groups:
            - name: EVPN-GW-PEERS
              activate: true
        address_family_ipv4:
          peer_groups:
            - name: IP-TRANSPORT-CLIENTS
              activate: true
  nodes:
    - name: BB1
      id: 1
      mgmt_ip: 172.100.100.101/22
      structured_config:
        router_bgp:
          address_family_ipv4:
            networks:
              - prefix: 10.0.0.1/32
    - name: BB2
      id: 2
      mgmt_ip: 172.100.100.102/22
      structured_config:
        router_bgp:
          address_family_ipv4:
            networks:
              - prefix: 10.0.0.2/32
