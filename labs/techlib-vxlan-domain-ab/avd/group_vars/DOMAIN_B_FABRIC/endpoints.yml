---
# Domain B — connected endpoints (see topology.clab.yml for the cabling)
#
#   HostB1  B-LEAF1/2  Po7  VLAN 20   EVPN All-Active
#   HostB2  B-LEAF1/2  Po8  VLAN 40   EVPN All-Active
#   HostB3  B-LEAF3    Et7  VLAN 60   single-homed
#   HostB4  B-LEAF3/4  Po8  VLAN 10   EVPN All-Active (LACP system-id ...0034)
#   HostB5  B-LEAF4    Et7  VLAN 70   single-homed
#   HostB6  B-SW1      Et3  VLAN 40   single-homed (behind the L2 switch)
#   HostB7  B-SW1      Et4  VLAN 80   single-homed (behind the L2 switch)
#   HostB8  B-LEAF7/8  Po9  VLAN 60   EVPN All-Active (LACP system-id ...0008)
#
# The guide labels the host ports with the short host names (B1, B2, ...).

port_profiles:
  - profile: HOST-SINGLE
    mode: access
    spanning_tree_portfast: edge

  # EVPN All-Active multihoming: LACP-derived ESI, the port-channel tracks
  # the local EVPN sessions (no AVD 6.3 keys for `identifier auto lacp` or
  # the session tracker — structured config).
  - profile: HOST-ES-AA
    mode: access
    spanning_tree_portfast: edge
    port_channel:
      mode: active
      structured_config:
        evpn_ethernet_segment:
          identifier: auto lacp
        lacp_id: c0d6.8200.0000
        bgp:
          session_tracker: TRACK-LOCAL-EVPN-PEERS

servers:
  - name: B1
    adapters:
      - endpoint_ports: [eth1, eth2]
        switch_ports: [Ethernet7, Ethernet7]
        switches: [B-LEAF1, B-LEAF2]
        vlans: '20'
        profile: HOST-ES-AA

  - name: B2
    adapters:
      - endpoint_ports: [eth1, eth2]
        switch_ports: [Ethernet8, Ethernet8]
        switches: [B-LEAF1, B-LEAF2]
        vlans: '40'
        profile: HOST-ES-AA

  - name: B3
    adapters:
      - endpoint_ports: [eth1]
        switch_ports: [Ethernet7]
        switches: [B-LEAF3]
        vlans: '60'
        profile: HOST-SINGLE

  - name: B4
    adapters:
      - endpoint_ports: [eth1, eth2]
        switch_ports: [Ethernet8, Ethernet8]
        switches: [B-LEAF3, B-LEAF4]
        vlans: '10'
        profile: HOST-ES-AA
        port_channel:
          structured_config:
            lacp_id: c0d6.8200.0034

  - name: B5
    adapters:
      - endpoint_ports: [eth1]
        switch_ports: [Ethernet7]
        switches: [B-LEAF4]
        vlans: '70'
        profile: HOST-SINGLE

  - name: B6
    adapters:
      - endpoint_ports: [eth1]
        switch_ports: [Ethernet3]
        switches: [B-SW1]
        vlans: '40'
        profile: HOST-SINGLE

  - name: B7
    adapters:
      - endpoint_ports: [eth1]
        switch_ports: [Ethernet4]
        switches: [B-SW1]
        vlans: '80'
        profile: HOST-SINGLE

  - name: B8
    adapters:
      - endpoint_ports: [eth1, eth2]
        switch_ports: [Ethernet9, Ethernet9]
        switches: [B-LEAF7, B-LEAF8]
        vlans: '60'
        profile: HOST-ES-AA
        port_channel:
          structured_config:
            lacp_id: c0d6.8200.0008
