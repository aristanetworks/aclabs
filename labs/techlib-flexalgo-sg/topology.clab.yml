name: arista-flexalgo-solution-guide
prefix: ""

mgmt:
  network: custom_mgmt
  ipv4-subnet: 172.100.100.0/24

topology:

  kinds:
    arista_ceos:
      enforce-startup-config: true
      image: arista/ceos:latest
      env:
        CLAB_MGMT_VRF: MGMT
        INTFTYPE: et
    linux:
      image: ghcr.io/aristanetworks/aclabs/host-ubuntu:rev1.7

  nodes:
    PE1:
      kind: arista_ceos
      mgmt-ipv4: 172.100.100.201
      startup-config: startup-configs/__clabLabName__/__clabNodeName__/startup-config
      binds:
        - sn/__clabNodeName__.txt:/mnt/flash/ceos-config:ro
    PE2:
      kind: arista_ceos
      mgmt-ipv4: 172.100.100.202
      startup-config: startup-configs/__clabLabName__/__clabNodeName__/startup-config
      binds:
        - sn/__clabNodeName__.txt:/mnt/flash/ceos-config:ro
    P1:
      kind: arista_ceos
      mgmt-ipv4: 172.100.100.101
      startup-config: startup-configs/__clabLabName__/__clabNodeName__/startup-config
      binds:
        - sn/__clabNodeName__.txt:/mnt/flash/ceos-config:ro
    P2:
      kind: arista_ceos
      mgmt-ipv4: 172.100.100.102
      startup-config: startup-configs/__clabLabName__/__clabNodeName__/startup-config
      binds:
        - sn/__clabNodeName__.txt:/mnt/flash/ceos-config:ro
    P3:
      kind: arista_ceos
      mgmt-ipv4: 172.100.100.103
      startup-config: startup-configs/__clabLabName__/__clabNodeName__/startup-config
      binds:
        - sn/__clabNodeName__.txt:/mnt/flash/ceos-config:ro

  links:
    - endpoints: [ "PE2:et1", "P3:et2" ]
    - endpoints: [ "P2:et2", "PE2:et2" ]
    - endpoints: [ "P1:et2", "PE2:et3" ]
    - endpoints: [ "P1:et1", "PE1:et1" ]
    - endpoints: [ "P2:et1", "PE1:et2" ]
    - endpoints: [ "P3:et1", "PE1:et3" ]
