---
name: anta-psirt
prefix: ""

mgmt:
  network: anta-psirt-mgmt
  ipv4-subnet: 172.100.100.0/24

topology:
  defaults:
    kind: arista_ceos

  kinds:
    arista_ceos:
      image: arista/ceos:latest
      enforce-startup-config: true
      env:
        CLAB_MGMT_VRF: MGMT
        INTFTYPE: et

  nodes:
    eos1:
      mgmt-ipv4: 172.100.100.11
      startup-config: clab/init-configs/eos1.cfg
    eos2:
      mgmt-ipv4: 172.100.100.12
      startup-config: clab/init-configs/eos2.cfg
    eos3:
      mgmt-ipv4: 172.100.100.13
      startup-config: clab/init-configs/eos3.cfg
    eos4:
      mgmt-ipv4: 172.100.100.14
      startup-config: clab/init-configs/eos4.cfg

  links:
    # Double links within each switch pair.
    - endpoints: ["eos1:et1", "eos2:et1"]
    - endpoints: ["eos1:et2", "eos2:et2"]
    - endpoints: ["eos3:et1", "eos4:et1"]
    - endpoints: ["eos3:et2", "eos4:et2"]

    # Cross-connect every switch in the first pair to both in the second pair.
    - endpoints: ["eos1:et3", "eos3:et3"]
    - endpoints: ["eos1:et4", "eos4:et3"]
    - endpoints: ["eos2:et3", "eos3:et4"]
    - endpoints: ["eos2:et4", "eos4:et4"]
