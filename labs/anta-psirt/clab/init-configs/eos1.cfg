no aaa root
!
username arista privilege 15 role network-admin secret arista
!
vrf instance MGMT
!
service routing protocols model multi-agent
!
management ssh
   !! VerifySA147 expected: Failure (Affected) - SSH server is affected; strict checking mitigates the critical client path.
   hostkey client strict-checking
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
hostname eos1
!
spanning-tree mode mstp
!
interface Ethernet1
!
interface Ethernet2
!
interface Ethernet3
!
interface Ethernet4
!
interface Management1
   vrf MGMT
   ip address 172.100.100.11/24
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
end
