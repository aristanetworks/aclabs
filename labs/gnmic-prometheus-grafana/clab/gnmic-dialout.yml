# gNMIc dial-out (gRPC tunnel server).
# Same subscriptions, processors, and Prometheus export as gnmic.yml.
# Connection model: switches dial gnmic:30000; the collector then Subscribe()s
# through the tunnel. Keep this file in sync with gnmic.yml except for
# targets vs tunnel-server.
# https://gnmic.openconfig.net/user_guide/tunnel_server/
# https://github.com/aristanetworks/openmgmt/blob/main/docs/telemetry/adapters/gnmi-dial-out/index.md
username: arista
password: arista
port: 6030
timeout: 10s
insecure: true
encoding: json_ietf
log: true
use-tunnel-server: true

subscriptions:
  bgp_neighbors:
    paths:
      - /network-instances/network-instance[name=default]/protocols/protocol[name=BGP]/bgp/neighbors
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  cpu:
    paths:
      - components/component/cpu
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  cpu_load_avg:
    paths:
      - eos_native:/Kernel/sysinfo
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  processes:
    paths:
      - system/processes/process/state
    mode: stream
    stream-mode: sample
    sample-interval: 15s

  memory:
    paths:
      - components/component/state/memory/
      - system/memory/kernel/state
      - system/memory/state
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  intf_ctrs:
    paths:
      - /interfaces/interface[name=*]/state/counters
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  intf_admin_state:
    paths:
      - /interfaces/interface[name=*]/state/admin-status
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  intf_oper_state:
    paths:
      - /interfaces/interface[name=*]/state/oper-status
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  intf_config:
    paths:
      - interfaces/interface/subinterfaces/subinterface/ipv4/addresses/address/config
    mode: stream
    stream-mode: sample
    sample-interval: 5s

  show_ver:
    paths:
    - eos_native:/Eos/image
    mode: stream
    stream-mode: sample
    sample-interval: 60s

  boot_time:
    paths:
    - system/state/boot-time
    mode: stream
    stream-mode: sample
    sample-interval: 60s

  hardware:
    paths:
    - components/component/state
    - eos_native:/Sysdb/hardware/entmib
    mode: stream
    stream-mode: sample
    sample-interval: 60s

  isis_adjacencies:
    paths:
      - /network-instances/network-instance[name=default]/protocols/protocol[name=EVPN_UNDERLAY]/isis
    mode: stream
    stream-mode: sample
    sample-interval: 10s

  mac_table:
    paths:
      - network-instances/network-instance[name=default]/fdb/mac-table/entries/entry
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  arp:
    paths:
      - /interfaces/interface/subinterfaces/subinterface/ipv4/neighbors/neighbor
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  vlan_internal:
    paths:
      - eos_native:/Sysdb/bridging/config/vlanConfig
    mode: stream
    stream-mode: sample
    sample-interval: 30s

  conn_mon:
    paths:
      - arista/connectivity-monitor/clients/client
    mode: stream
    stream-mode: sample
    sample-interval: 10s

# EOS `target <hostname>` must match these ids (spine1, pe11, …).
tunnel-server:
  address: ":30000"
  targets:
    - id: spine1
      config: &dialout_target
        insecure: true
        subscriptions:
          - bgp_neighbors
          - cpu
          - cpu_load_avg
          - processes
          - memory
          - intf_ctrs
          - intf_admin_state
          - intf_oper_state
          - intf_config
          - show_ver
          - boot_time
          - hardware
          - isis_adjacencies
          - mac_table
          - arp
          - vlan_internal
          - conn_mon
    - id: spine2
      config: *dialout_target
    - id: pe11
      config: *dialout_target
    - id: pe12
      config: *dialout_target
    - id: pe21
      config: *dialout_target
    - id: pe22
      config: *dialout_target

outputs:
  prom:
    type: prometheus
    listen: :9273
    path: /metrics
    metric-prefix: gnmic
    append-subscription-name: true
    strings-as-labels: true
    export-timestamps: true
    debug: false
    event-processors:
      - extract-vlan-id
      - drop-gr
      - trim-prefixes
      - bounce-map
      - eos-version

processors:
  extract-vlan-id:
    event-extract-tags:
      value-names:
        - ".*vlanConfig/(?P<vlan_id>\\d+)/.*"
  eos-version:
    event-strings:
      value-names:
        - ".*version$"
        - ".*arch$"
      transforms:
        - replace:
            apply-on: "value"
            old: "EOS"
            new: "eos"
  trim-prefixes:
    event-strings:
      value-names:
        - ".*"
      transforms:
        - path-base:
            apply-on: "name"
  bounce-map:
    event-strings:
      value-names:
        - oper-status
        - admin-status
      transforms:
        - replace:
            apply-on: "value"
            old: "UP"
            new: "1"
        - replace:
            apply-on: "value"
            old: "DOWN"
            new: "0"
  # Need this processor, otherwise trim-prefixes will cause name collision and overwrite the pfxRcd
  # metrics to 0
  drop-gr:
    event-delete:
      value-names:
        - ".*graceful-restart.*"
