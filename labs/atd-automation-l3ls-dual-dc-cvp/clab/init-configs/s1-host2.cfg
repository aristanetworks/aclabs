daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.100.5:9910 -cvauth=token,/mnt/flash/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
no aaa root
!
username arista privilege 15 role network-admin secret arista
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname s1-host2
dns domain atd.lab
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
aaa authorization exec default local
!
interface Port-Channel1
   no switchport
   ip address 10.20.20.100/24
!
interface Ethernet1
   channel-group 1 mode active
!
interface Ethernet2
   channel-group 1 mode active
!
interface Management1
   vrf MGMT
   ip address 192.168.0.17/24
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
ip name-server vrf MGMT 192.168.0.1
!
ip route 0.0.0.0/0 10.20.20.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT time.apple.com
ntp server vrf MGMT time.google.com
ntp server vrf MGMT time.windows.com
!
end
