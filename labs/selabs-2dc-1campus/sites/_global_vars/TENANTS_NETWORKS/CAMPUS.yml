---
# Tenant GREEN Specific Information - VRFs / VLANs

CAMPUS: # dynamic_key: network_services
  - name: Campus
    vrfs:
      - name: default
        validate_bgp_peers: true
        svis:
          - id: 1000
            name: DC_edge_Blue
            tags: [DC_edge]
            ip_virtual_router_addresses: [172.16.254.1]
            enabled: true
            nodes:
              - node: campus-spine1
                ip_address: 172.16.254.2/29
              - node: campus-spine2
                ip_address: 172.16.254.3/29
          - id: 1001
            name: DC_edge_Green
            tags: [DC_edge]
            ip_virtual_router_addresses: [172.16.254.9]
            enabled: true
            nodes:
              - node: campus-spine1
                ip_address: 172.16.254.10/29
              - node: campus-spine2
                ip_address: 172.16.254.11/29
          - id: 1110
            name: vlan_1110
            tags: [Campus]
            ip_virtual_router_addresses: [10.10.110.1]
            enabled: true
            nodes:
              - node: campus-spine1
                ip_address: 10.10.110.2/24
              - node: campus-spine2
                ip_address: 10.10.110.3/24
          - id: 1120
            name: vlan_1120
            tags: [Campus]
            ip_virtual_router_addresses: [10.10.120.1]
            enabled: true
            nodes:
              - node: campus-spine1
                ip_address: 10.10.120.2/24
              - node: campus-spine2
                ip_address: 10.10.120.3/24
        bgp_peers:
          - ip_address: 172.16.254.5
            remote_as: 65103
            nodes: [campus-spine1, campus-spine2]
            # route_map_out: RM-CAMPUS-RT-OUT
            next_hop_self: True
          - ip_address: 172.16.254.6
            remote_as: 65103
            nodes: [campus-spine1, campus-spine2]
            # route_map_out: RM-CAMPUS-RT-OUT
            next_hop_self: True
          - ip_address: 172.16.254.13
            remote_as: 65103
            nodes: [campus-spine1, campus-spine2]
            # route_map_out: RM-CAMPUS-RT-OUT
            next_hop_self: True
          - ip_address: 172.16.254.14
            remote_as: 65103
            nodes: [campus-spine1, campus-spine2]
            # route_map_out: RM-CAMPUS-RT-OUT
            next_hop_self: True
        bgp:
          structured_config:
              redistribute:
                ospf:
                  enabled: True
                  # route_map: RM-CAMPUS-RT-OUT
                connected:
                  enabled: True
                  # route_map: <str>
        ospf:
          redistribute_connected:
            enabled: True
