aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
banners:
  motd: '0 to Hero network

    EOF

    '
clock:
  timezone: EST
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
  sflowaddr: default/127.0.0.1:6343
dns_domain: demo.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet51
  description: MLAG_campus-leaf4_Ethernet51
  shutdown: false
  channel_group:
    id: 51
    mode: active
  metadata:
    peer: campus-leaf4
    peer_interface: Ethernet51
    peer_type: mlag_peer
- name: Ethernet52
  description: MLAG_campus-leaf4_Ethernet52
  shutdown: false
  channel_group:
    id: 51
    mode: active
  metadata:
    peer: campus-leaf4
    peer_interface: Ethernet52
    peer_type: mlag_peer
- name: Ethernet49
  description: L2_campus-spine1_Ethernet1/5
  shutdown: false
  channel_group:
    id: 49
    mode: active
  metadata:
    peer: campus-spine1
    peer_interface: Ethernet1/5
    peer_type: l3spine
- name: Ethernet50
  description: L2_campus-spine2_Ethernet1/5
  shutdown: false
  channel_group:
    id: 49
    mode: active
  metadata:
    peer: campus-spine2
    peer_interface: Ethernet1/5
    peer_type: l3spine
hostname: campus-leaf3
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
    - ip_address: 8.8.4.4
local_users:
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.34/24
  type: oob
  gateway: 192.168.0.1
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: CAMPUS
  validate_hardware:
    enabled: false
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Leaf
    - name: Role
      value: Leaf
    - name: Campus
      value: CAMPUS
    - name: Campus-Pod
      value: POD2
    - name: Access-Pod
      value: CAMPUS-ACCESS-POD1
    interface_tags:
    - interface: Ethernet51
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet52
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet49
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet50
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Management1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
