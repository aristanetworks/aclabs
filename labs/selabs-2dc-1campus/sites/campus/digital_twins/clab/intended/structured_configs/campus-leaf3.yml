    node_type: veos
    ip_addr: 192.168.0.34/24
    version: 4.36.0.1F
    username: cvpadmin
    password: cvp123!
mlag_configuration:
  domain_id: POD2
  local_interface: Vlan4094
  peer_address: 10.101.255.1
  peer_address_heartbeat:
    peer_ip: 192.168.0.35
    vrf: MGMT
  dual_primary_detection_delay: 5
  peer_link: Port-Channel51
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.north-america.pool.ntp.org
    preferred: true
  - name: 1.north-america.pool.ntp.org
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel51
  description: MLAG_campus-leaf4_Port-Channel51
  shutdown: false
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel49
  description: L2_SPINES_Port-Channel15
  shutdown: false
  mlag: 49
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 1110,1120
service_routing_protocols_model: multi-agent
sflow:
  sample: 10
  polling_interval: 50
  destinations:
  - destination: 127.0.0.1
    port: 6343
  source_interface: Vlan4094
  run: true
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
  no_spanning_tree_vlan: '4094'
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.1
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.101.255.0/31
  mtu: 1500
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 1110
  name: vlan_1110
  metadata:
    tenants:
    - Campus
- id: 1120
  name: vlan_1120
  metadata:
    tenants:
    - Campus
vrfs:
- name: MGMT
  ip_routing: false
