!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -sflowaddr=default/127.0.0.1:6343 -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname campus-leaf1
ip name-server vrf MGMT 8.8.4.4
ip name-server vrf MGMT 8.8.8.8
dns domain demo.lab
!
sflow sample 10
sflow polling-interval 50
sflow destination 127.0.0.1 6343
sflow source-interface Vlan4094
sflow run
!
spanning-tree mode mstp
no spanning-tree vlan-id 4094
spanning-tree mst 0 priority 32768
!
clock timezone EST
!
vlan 1110
   name vlan_1110
!
vlan 1120
   name vlan_1120
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
banner motd
0 to Hero network
EOF

!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel49
   description L2_SPINES_Port-Channel13
   no shutdown
   switchport trunk allowed vlan 1110,1120
   switchport mode trunk
   switchport
   mlag 49
   sflow enable
!
interface Port-Channel51
   description MLAG_campus-leaf2_Port-Channel51
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
   sflow enable
!
interface Ethernet49
   description L2_campus-spine1_Ethernet1/3
   no shutdown
   channel-group 49 mode active
!
interface Ethernet50
   description L2_campus-spine2_Ethernet1/3
   no shutdown
   channel-group 49 mode active
!
interface Ethernet51
   description MLAG_campus-leaf2_Ethernet51
   no shutdown
   channel-group 51 mode active
!
interface Ethernet52
   description MLAG_campus-leaf2_Ethernet52
   no shutdown
   channel-group 51 mode active
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.32/24
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.101.255.0/31
no ip routing vrf MGMT
!
mlag configuration
   domain-id POD1
   local-interface Vlan4094
   peer-address 10.101.255.1
   peer-address heartbeat 192.168.0.33 vrf MGMT
   peer-link Port-Channel51
   dual-primary detection delay 5 action errdisable all-interfaces
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.north-america.pool.ntp.org prefer
ntp server vrf MGMT 1.north-america.pool.ntp.org
!
end
