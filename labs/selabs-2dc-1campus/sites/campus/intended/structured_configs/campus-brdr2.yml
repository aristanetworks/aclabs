aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
banners:
  motd: '0 to Hero network

    EOF

    '
clock:
  timezone: EST
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.cv-prod-na-northeast1-b.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
  sflowaddr: default/127.0.0.1:6343
dns_domain: demo.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet51/1
  description: MLAG_campus-brdr1_Ethernet51/1
  shutdown: false
  channel_group:
    id: 511
    mode: active
  metadata:
    peer: campus-brdr1
    peer_interface: Ethernet51/1
    peer_type: mlag_peer
- name: Ethernet52/1
  description: MLAG_campus-brdr1_Ethernet52/1
  shutdown: false
  channel_group:
    id: 511
    mode: active
  metadata:
    peer: campus-brdr1
    peer_interface: Ethernet52/1
    peer_type: mlag_peer
- name: Ethernet49/1
  description: L2_campus-spine1_Ethernet1/2
  shutdown: false
  channel_group:
    id: 491
    mode: active
  metadata:
    peer: campus-spine1
    peer_interface: Ethernet1/2
    peer_type: l3spine
- name: Ethernet50/1
  description: L2_campus-spine2_Ethernet1/2
  shutdown: false
  channel_group:
    id: 491
    mode: active
  metadata:
    peer: campus-spine2
    peer_interface: Ethernet1/2
    peer_type: l3spine
- name: Ethernet48
  description: dc1-brdr2
  shutdown: false
  metadata:
    peer: dc1-brdr2
    peer_interface: Ethernet47
    peer_type: network_port
    peer_key: network_ports
    validate_state: true
    validate_lldp: true
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 1000,1001
hostname: campus-brdr2
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
    - ip_address: 8.8.4.4
local_users:
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.37/24
  type: oob
metadata:
  is_deployed: true
  platform: 7280R3
  fabric_name: CAMPUS
  cv_tags:
    device_tags:
    - name: topology_hint_network_type
      value: campusV2
    - name: topology_hint_type
      value: Leaf
    - name: Role
      value: Leaf
    - name: Campus
      value: CAMPUS
    - name: Campus-Pod
      value: BORDER_POD
    - name: Access-Pod
      value: CAMPUS-ACCESS-POD1
    interface_tags:
    - interface: Ethernet51/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet52/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: MLAG
    - interface: Ethernet49/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet50/1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Fabric
      - name: Link-Type
        value: Uplink
    - interface: Ethernet48
      tags:
      - name: Link-Type
        value: AVD-Managed
    - interface: Management1
      tags:
      - name: Link-Type
        value: AVD-Managed
      - name: Link-Type
        value: Management
mlag_configuration:
  domain_id: BORDER_POD
  local_interface: Vlan4094
  peer_address: 10.101.255.0
  peer_address_heartbeat:
    peer_ip: 192.168.0.36
    vrf: MGMT
  dual_primary_detection_delay: 5
  peer_link: Port-Channel511
  reload_delay_mlag: '900'
  reload_delay_non_mlag: '1020'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.north-america.pool.ntp.org
    preferred: true
  - name: 1.north-america.pool.ntp.org
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel511
  description: MLAG_campus-brdr1_Port-Channel511
  shutdown: false
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel491
  description: L2_SPINES_Port-Channel11
  shutdown: false
  mlag: 491
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 1000-1001,1110,1120
service_routing_protocols_model: multi-agent
sflow:
  sample: 10
  polling_interval: 50
  destinations:
  - destination: 127.0.0.1
    port: 6343
  source_interface: Vlan4094
  run: true
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
  no_spanning_tree_vlan: '4094'
tcam_profile:
  system: vxlan-routing
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.101.255.1/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 1000
  name: DC_edge_Blue
  metadata:
    tenants:
    - Campus
- id: 1001
  name: DC_edge_Green
  metadata:
    tenants:
    - Campus
- id: 1110
  name: vlan_1110
  metadata:
    tenants:
    - Campus
- id: 1120
  name: vlan_1120
  metadata:
    tenants:
    - Campus
vrfs:
- name: MGMT
  ip_routing: false
