# L3 Leaf switches

type: l3leaf

pod_name: DC1_POD

l3leaf:
  defaults:
    platform: 7050X3
    bgp_as: 65100
    loopback_ipv4_pool: 10.99.1.0/25
    vtep_loopback_ipv4_pool: 10.101.1.0/24
    mlag_peer_ipv4_pool: 10.101.255.0/31
    mlag_peer_l3_ipv4_pool: 10.101.254.0/31
    mlag_dual_primary_detection: true
    uplink_ipv4_pool: 10.101.0.0/24
    uplink_switches: [dc1-spine1, dc1-spine2]
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    virtual_router_mac_address: 00:1c:73:00:00:99
    uplink_bfd: true

  node_groups:
    - group: DC1_LEAF1
      bgp_as: 65101
      filter:
        tenants: [BLUE, GREEN]
        tags: [DC1]
      nodes:
        - name: dc1-leaf1
          mgmt_ip: 192.168.0.12/24
        - name: dc1-leaf2
          mgmt_ip: 192.168.0.13/24
    - group: DC1_LEAF2
      bgp_as: 65102
      filter:
        tenants: [BLUE, GREEN]
        tags: [DC1]
      nodes:
        - name: dc1-leaf3
          mgmt_ip: 192.168.0.14/24
        - name: dc1-leaf4
          mgmt_ip: 192.168.0.15/24
    - group: DC1_BORDER_LEAF1
      platform: 7280R3
      bgp_as: 65103
      filter:
        tenants: [BLUE, GREEN]
        tags: [DC1, DC_edge]
      evpn_gateway:
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
      nodes:
        - name: dc1-brdr1
          mgmt_ip: 192.168.0.100/24
          evpn_gateway:
            remote_peers:
              - hostname: dc2-brdr1
                bgp_as: 64103
                ip_address: 10.99.2.1
        - name: dc1-brdr2
          mgmt_ip: 192.168.0.101/24
          evpn_gateway:
            remote_peers:
              - hostname: dc2-brdr2
                bgp_as: 64103
                ip_address: 10.99.2.2
