  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel531
  description: L2_DC1_L2LEAF12_Port-Channel49
  shutdown: false
  mlag: 531
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 100,102,200
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.99.1.0/25 eq 32
  - sequence: 20
    action: permit 10.101.1.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.254.0/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 1200
    min_rx: 1200
    multiplier: 3
router_bgp:
  as: '65101'
  router_id: 10.99.1.4
  distance:
    external_routes: 20
    internal_routes: 200
    local_routes: 200
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65101'
    description: dc1-leaf1
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: AQQvKeimxJu+uGQ/yYvv9w==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.101.254.0
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: dc1-leaf1
    description: dc1-leaf1_Vlan4093
  - ip_address: 10.101.0.12
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet1/4
    bfd: true
  - ip_address: 10.101.0.14
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet1/4
    bfd: true
  - ip_address: 10.99.1.129
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.99.1.130
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 100
    metadata:
      tenants:
      - BLUE
    rd: 10.99.1.4:10100
    route_targets:
      both:
      - 10100:10100
    redistribute_routes:
    - learned
  - id: 102
    metadata:
      tenants:
      - BLUE
    rd: 10.99.1.4:10102
    route_targets:
      both:
      - 10102:10102
    redistribute_routes:
    - learned
  - id: 200
    metadata:
      tenants:
      - GREEN
    rd: 10.99.1.4:10200
    route_targets:
      both:
      - 10200:10200
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: BLUE
    rd: 10.99.1.4:501
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 501:501
      export:
      - address_family: evpn
        route_targets:
        - 501:501
    router_id: 10.99.1.4
    neighbors:
    - ip_address: 10.101.254.0
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf1_Vlan3500
      metadata:
        validate_state: true
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
  - name: GREEN
    rd: 10.99.1.4:502
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 502:502
      export:
      - address_family: evpn
        route_targets:
        - 502:502
    router_id: 10.99.1.4
    neighbors:
    - ip_address: 10.101.254.0
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf1_Vlan3501
      metadata:
        validate_state: true
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
