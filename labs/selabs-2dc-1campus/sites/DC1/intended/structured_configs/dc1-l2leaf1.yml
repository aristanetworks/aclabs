aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
banners:
  motd: '0 to Hero network

    EOF

    '
clock:
  timezone: EST
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.cv-prod-na-northeast1-b.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
  sflowaddr: default/127.0.0.1:6343
dns_domain: demo.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet51
  description: MLAG_dc1-l2leaf2_Ethernet51
  shutdown: false
  channel_group:
    id: 51
    mode: active
  metadata:
    peer: dc1-l2leaf2
    peer_interface: Ethernet51
    peer_type: mlag_peer
- name: Ethernet52
  description: MLAG_dc1-l2leaf2_Ethernet52
  shutdown: false
  channel_group:
    id: 51
    mode: active
  metadata:
    peer: dc1-l2leaf2
    peer_interface: Ethernet52
    peer_type: mlag_peer
- name: Ethernet49
  description: L2_dc1-leaf1_Ethernet53/1
  shutdown: false
  channel_group:
    id: 49
    mode: active
  metadata:
    peer: dc1-leaf1
    peer_interface: Ethernet53/1
    peer_type: l3leaf
- name: Ethernet50
  description: L2_dc1-leaf2_Ethernet53/1
  shutdown: false
  channel_group:
    id: 49
    mode: active
  metadata:
    peer: dc1-leaf2
    peer_interface: Ethernet53/1
    peer_type: l3leaf
- name: Ethernet1
  description: SERVER_dc1-host1_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: dc1-host1
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
hostname: dc1-l2leaf1
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
    - ip_address: 8.8.4.4
local_users:
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.16/24
  type: oob
metadata:
  is_deployed: true
  platform: 720XP
  pod_name: DC1_POD
  dc_name: DC1
  fabric_name: DC1
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: DC1
    - name: topology_hint_pod
      value: DC1_POD
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: DC1_L2LEAF12
mlag_configuration:
  domain_id: DC1_L2LEAF12
  local_interface: Vlan4094
  peer_address: 10.101.255.1
  peer_address_heartbeat:
    peer_ip: 192.168.0.17
    vrf: MGMT
  dual_primary_detection_delay: 5
  peer_link: Port-Channel51
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.north-america.pool.ntp.org
    preferred: true
  - name: 1.north-america.pool.ntp.org
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel51
  description: MLAG_dc1-l2leaf2_Port-Channel51
  shutdown: false
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel49
  description: L2_DC1_LEAF1_Port-Channel531
  shutdown: false
  mlag: 49
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 100,102,200
- name: Port-Channel1
  description: SERVER_dc1-host1
  shutdown: false
  mlag: 1
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: access
    access_vlan: 100
service_routing_protocols_model: multi-agent
sflow:
  sample: 10
  polling_interval: 50
  destinations:
  - destination: 127.0.0.1
    port: 6343
  source_interface: Vlan4094
  run: true
spanning_tree:
  mode: mstp
  mst_instances:
  - id: '0'
    priority: 32768
  no_spanning_tree_vlan: '4094'
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.101.255.0/31
  mtu: 9214
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 100
  name: BLUE_VLAN_100
  metadata:
    tenants:
    - BLUE
- id: 102
  name: BLUE_VLAN_102
  metadata:
    tenants:
    - BLUE
- id: 200
  name: GREEN_VLAN_200
  metadata:
    tenants:
    - GREEN
vrfs:
- name: MGMT
  ip_routing: false
