aaa_authorization:
  exec:
    default: local
aaa_root:
  disabled: true
banners:
  motd: '0 to Hero network

    EOF

    '
clock:
  timezone: EST
config_end: true
daemon_terminattr:
  cvaddrs:
  - apiserver.cv-prod-na-northeast1-b.arista.io:443
  cvauth:
    method: token-secure
    token_file: /tmp/cv-onboarding-token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: true
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
  sflowaddr: default/127.0.0.1:6343
dns_domain: demo.lab
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet51/1
  description: MLAG_dc1-leaf4_Ethernet51/1
  shutdown: false
  channel_group:
    id: 511
    mode: active
  metadata:
    peer: dc1-leaf4
    peer_interface: Ethernet51/1
    peer_type: mlag_peer
- name: Ethernet52/1
  description: MLAG_dc1-leaf4_Ethernet52/1
  shutdown: false
  channel_group:
    id: 511
    mode: active
  metadata:
    peer: dc1-leaf4
    peer_interface: Ethernet52/1
    peer_type: mlag_peer
- name: Ethernet49/1
  description: P2P_dc1-spine1_Ethernet1/5
  shutdown: false
  mtu: 9214
  ip_address: 10.101.0.17/31
  metadata:
    peer: dc1-spine1
    peer_interface: Ethernet1/5
    peer_type: spine
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet50/1
  description: P2P_dc1-spine2_Ethernet1/5
  shutdown: false
  mtu: 9214
  ip_address: 10.101.0.19/31
  metadata:
    peer: dc1-spine2
    peer_interface: Ethernet1/5
    peer_type: spine
  sflow:
    enable: true
  switchport:
    enabled: false
- name: Ethernet1
  description: SERVER_dc1-host2_Ethernet1
  shutdown: false
  channel_group:
    id: 1
    mode: active
  metadata:
    peer: dc1-host2
    peer_interface: Ethernet1
    peer_type: server
    peer_key: servers
hostname: dc1-leaf3
ip_igmp_snooping:
  globally_enabled: true
ip_name_server:
  vrfs:
  - name: MGMT
    servers:
    - ip_address: 8.8.8.8
    - ip_address: 8.8.4.4
ip_routing: true
ip_virtual_router_mac_address: 00:1c:73:00:00:99
local_users:
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.99.1.5/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 10.101.1.5/32
- name: Loopback101
  description: DIAG_VRF_BLUE
  shutdown: false
  vrf: BLUE
  ip_address: 10.0.10.69/32
- name: Loopback102
  description: DIAG_VRF_GREEN
  shutdown: false
  vrf: GREEN
  ip_address: 10.0.10.133/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.14/24
  type: oob
metadata:
  is_deployed: true
  platform: 7050X3
  pod_name: DC1_POD
  dc_name: DC1
  fabric_name: DC1
  cv_tags:
    device_tags:
    - name: topology_hint_datacenter
      value: DC1
    - name: topology_hint_fabric
      value: DC1
    - name: topology_hint_pod
      value: DC1_POD
    - name: topology_hint_type
      value: leaf
    - name: topology_hint_rack
      value: DC1_LEAF2
mlag_configuration:
  domain_id: DC1_LEAF2
  local_interface: Vlan4094
  peer_address: 10.101.255.1
  peer_address_heartbeat:
    peer_ip: 192.168.0.15
    vrf: MGMT
  dual_primary_detection_delay: 5
  peer_link: Port-Channel511
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 0.north-america.pool.ntp.org
    preferred: true
  - name: 1.north-america.pool.ntp.org
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel511
  description: MLAG_dc1-leaf4_Port-Channel511
  shutdown: false
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: SERVER_dc1-host2
  shutdown: false
  mlag: 1
  sflow:
    enable: true
  switchport:
    enabled: true
    mode: access
    access_vlan: 200
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.99.1.0/25 eq 32
  - sequence: 20
    action: permit 10.101.1.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.101.254.0/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65102'
  router_id: 10.99.1.5
  distance:
    external_routes: 20
    internal_routes: 200
    local_routes: 200
  graceful_restart:
    enabled: true
    restart_time: 300
  maximum_paths:
    paths: 4
  updates:
    wait_install: true
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65102'
    description: dc1-leaf4
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    password: AQQvKeimxJu+uGQ/yYvv9w==
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.101.254.1
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: dc1-leaf4
    description: dc1-leaf4_Vlan4093
  - ip_address: 10.101.0.16
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Ethernet1/5
    bfd: true
  - ip_address: 10.101.0.18
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Ethernet1/5
    bfd: true
  - ip_address: 10.99.1.129
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine1
    description: dc1-spine1_Loopback0
  - ip_address: 10.99.1.130
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: dc1-spine2
    description: dc1-spine2_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 100
    metadata:
      tenants:
      - BLUE
    rd: 10.99.1.5:10100
    route_targets:
      both:
      - 10100:10100
    redistribute_routes:
    - learned
  - id: 102
    metadata:
      tenants:
      - BLUE
    rd: 10.99.1.5:10102
    route_targets:
      both:
      - 10102:10102
    redistribute_routes:
    - learned
  - id: 200
    metadata:
      tenants:
      - GREEN
    rd: 10.99.1.5:10200
    route_targets:
      both:
      - 10200:10200
    redistribute_routes:
    - learned
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
  vrfs:
  - name: BLUE
    rd: 10.99.1.5:501
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 501:501
      export:
      - address_family: evpn
        route_targets:
        - 501:501
    router_id: 10.99.1.5
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.101.254.1
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf4_Vlan3500
      metadata:
        validate_state: true
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
  - name: GREEN
    rd: 10.99.1.5:502
    route_targets:
      import:
      - address_family: evpn
        route_targets:
        - 502:502
      export:
      - address_family: evpn
        route_targets:
        - 502:502
    router_id: 10.99.1.5
    updates:
      wait_install: true
    neighbors:
    - ip_address: 10.101.254.1
      peer_group: MLAG-IPv4-UNDERLAY-PEER
      description: dc1-leaf4_Vlan3501
      metadata:
        validate_state: true
    redistribute:
      connected:
        enabled: true
        route_map: RM-CONN-2-BGP-VRFS
service_routing_protocols_model: multi-agent
sflow:
