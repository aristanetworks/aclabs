!
no enable password
no aaa root
!
username cvpadmin privilege 15 role network-admin secret sha512 $6$vQGQxmJp16IINuqk$makfRsxIS8Das8bugela5cdUd0iSUzA0/nPRXWXmonGeQ/vuqWi.vrr1OINH4MZLCOux0tniArjvyJNJHe9Zt.
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=MGMT -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs -sflowaddr=default/127.0.0.1:6343 -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc2-brdr2
ip name-server vrf MGMT 8.8.4.4
ip name-server vrf MGMT 8.8.8.8
dns domain demo.lab
!
sflow sample 10
sflow polling-interval 50
sflow destination 127.0.0.1 6343
sflow source-interface Loopback0
sflow run
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
clock timezone EST
!
vlan 100
   name BLUE_VLAN_100
!
vlan 200
   name GREEN_VLAN_200
!
vlan 3500
   name MLAG_L3_VRF_BLUE
   trunk group MLAG
!
vlan 3501
   name MLAG_L3_VRF_GREEN
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance BLUE
!
vrf instance GREEN
!
vrf instance MGMT
!
banner motd
0 to Hero network
EOF

!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel511
   description MLAG_dc2-brdr1_Port-Channel511
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
   sflow enable
!
interface Ethernet48
   description P2P_dc1-brdr2_Ethernet48
   no shutdown
   mtu 1500
   no switchport
   ip address 172.16.255.3/31
   sflow enable
!
interface Ethernet49/1
   description P2P_dc2-spine1_Ethernet1/2
   no shutdown
   mtu 1500
   no switchport
   ip address 10.102.0.5/31
   sflow enable
!
interface Ethernet50/1
   description P2P_dc2-spine2_Ethernet1/2
   no shutdown
   mtu 1500
   no switchport
   ip address 10.102.0.7/31
   sflow enable
!
interface Ethernet51/1
   description MLAG_dc2-brdr1_Ethernet51/1
   no shutdown
   channel-group 511 mode active
!
interface Ethernet52/1
   description MLAG_dc2-brdr1_Ethernet52/1
   no shutdown
   channel-group 511 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.99.2.2/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.102.2.1/32
!
interface Loopback101
   description DIAG_VRF_BLUE
   no shutdown
   vrf BLUE
   ip address 10.0.10.66/32
!
interface Loopback102
   description DIAG_VRF_GREEN
   no shutdown
   vrf GREEN
   ip address 10.0.10.130/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.201/24
!
interface Vlan100
   description BLUE_VLAN_100
   no shutdown
   vrf BLUE
   ip address virtual 10.10.100.1/24
!
interface Vlan200
   description GREEN_VLAN_200
   no shutdown
   vrf GREEN
   ip address virtual 10.10.200.1/24
!
interface Vlan3500
   description MLAG_L3_VRF_BLUE
   no shutdown
   mtu 1500
   vrf BLUE
   ip address 10.102.254.1/31
!
interface Vlan3501
   description MLAG_L3_VRF_GREEN
   no shutdown
   mtu 1500
   vrf GREEN
   ip address 10.102.254.1/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.102.254.1/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.102.255.1/31
!
interface Vxlan1
   description dc2-brdr2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 200 vni 10200
   vxlan vrf BLUE vni 501
   vxlan vrf GREEN vni 502
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf BLUE address 10.0.10.66
ip address virtual source-nat vrf GREEN address 10.0.10.130
!
ip routing
ip routing vrf BLUE
ip routing vrf GREEN
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.99.2.0/25 eq 32
   seq 20 permit 10.102.2.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.102.254.0/31
!
mlag configuration
   domain-id DC2_BORDER_LEAF1
   local-interface Vlan4094
   peer-address 10.102.255.0
   peer-address heartbeat 192.168.0.200 vrf MGMT
   peer-link Port-Channel511
   dual-primary detection delay 5 action errdisable all-interfaces
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.1
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.north-america.pool.ntp.org prefer
ntp server vrf MGMT 1.north-america.pool.ntp.org
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 1200 min-rx 1200 multiplier 3
!
router bgp 64103
   router-id 10.99.2.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   maximum-paths 4
   neighbor EVPN-OVERLAY-CORE peer group
   neighbor EVPN-OVERLAY-CORE update-source Loopback0
   neighbor EVPN-OVERLAY-CORE bfd
   neighbor EVPN-OVERLAY-CORE ebgp-multihop 15
   neighbor EVPN-OVERLAY-CORE send-community
   neighbor EVPN-OVERLAY-CORE maximum-routes 0
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password 7 AQQvKeimxJu+uGQ/yYvv9w==
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 64103
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description dc2-brdr1
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.99.1.2 peer group EVPN-OVERLAY-CORE
   neighbor 10.99.1.2 remote-as 65103
   neighbor 10.99.1.2 description dc1-brdr2
   neighbor 10.99.2.129 peer group EVPN-OVERLAY-PEERS
   neighbor 10.99.2.129 remote-as 64000
   neighbor 10.99.2.129 description dc2-spine1_Loopback0
   neighbor 10.99.2.130 peer group EVPN-OVERLAY-PEERS
   neighbor 10.99.2.130 remote-as 64000
   neighbor 10.99.2.130 description dc2-spine2_Loopback0
   neighbor 10.102.0.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.0.4 remote-as 64000
   neighbor 10.102.0.4 description dc2-spine1_Ethernet1/2
   neighbor 10.102.0.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.102.0.6 remote-as 64000
   neighbor 10.102.0.6 description dc2-spine2_Ethernet1/2
   neighbor 10.102.254.0 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.102.254.0 description dc2-brdr1_Vlan4093
   neighbor 172.16.255.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.16.255.2 remote-as 65103
   neighbor 172.16.255.2 description dc1-brdr2
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.99.2.2:10100
      rd evpn domain remote 10.99.2.2:10100
      route-target both 10100:10100
      route-target import export evpn domain remote 10100:10100
      redistribute learned
   !
   vlan 200
      rd 10.99.2.2:10200
      rd evpn domain remote 10.99.2.2:10200
      route-target both 10200:10200
      route-target import export evpn domain remote 10200:10200
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-CORE activate
      neighbor EVPN-OVERLAY-CORE domain remote
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-CORE activate
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf BLUE
      rd 10.99.2.2:501
      route-target import evpn 501:501
      route-target export evpn 501:501
      router-id 10.99.2.2
      neighbor 10.102.254.0 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.102.254.0 description dc2-brdr1_Vlan3500
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf GREEN
      rd 10.99.2.2:502
      route-target import evpn 502:502
      route-target export evpn 502:502
      router-id 10.99.2.2
      neighbor 10.102.254.0 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.102.254.0 description dc2-brdr1_Vlan3501
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
