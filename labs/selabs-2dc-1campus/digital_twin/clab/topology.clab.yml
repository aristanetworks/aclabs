# hosts
    dc1-host1:
      kind: linux
      mgmt-ipv4: 192.168.0.128
      exec:
        - bash /tmp/init-user.sh
        - systemctl stop NetworkManager || true
        - while ! ip link show eth1 >/dev/null 2>&1 || ! ip link show eth2 >/dev/null 2>&1; do sleep 1; done
        - ip link add bond0 type bond mode 802.3ad xmit_hash_policy layer3+4
        - ip link set bond0 down
        - ip link set eth1 down
        - ip link set eth1 mtu 1500
        - ip link set eth1 master bond0
        - ip link set eth2 down
        - ip link set eth2 mtu 1500
        - ip link set eth2 master bond0
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set bond0 up
        - ip addr add 10.10.100.10/24 dev bond0
        - ip route add 10.0.0.0/8 via 10.10.100.1 dev bond0
