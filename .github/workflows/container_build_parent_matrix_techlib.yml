---
name: build techlib image

on:
  push:
    branches: ['**']  # branches will be filtered in the jobs
    paths:
      - .github/workflows/container_build_child.yml
      - .github/workflows/container_build_parent_matrix_techlib.yml
      - containers/techlib/**
  workflow_dispatch:
    branches: ['**']  # branches will be filtered in the jobs

permissions:
  packages: write

jobs:
  vars:
    # GHCR paths must be lowercase.
    # strategy.matrix is evaluated BEFORE any step exists, so it can only
    # read the github / inputs / vars / needs contexts -- never steps.*.
    # This precursor job therefore carries the LOWERCASED repo owner as a
    # JOB OUTPUT, which the build matrix consumes via needs.*.
    if: github.repository != 'aristanetworks/acLabs' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      gh_org_lowercase: ${{ steps.org.outputs.gh_org_lowercase }}
    steps:
      - id: org
        run: echo "gh_org_lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-lab-containers:
    needs: vars
    # fork - build container from any branch for testing
    # parent repo - build on main branch only
    if: github.repository != 'aristanetworks/acLabs' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/container_build_child.yml
    strategy:
      matrix:
        from_image: ["ghcr.io/${{ needs.vars.outputs.gh_org_lowercase }}/aclabs/lab-base:python3.12-avd-v6.3.0-clab0.79.0-rev2.6.11-uid1009"]
        user_id: ["1009"]

    with:
      container_name: techlib
      from_image: ${{ matrix.from_image }}
      user_id: ${{ matrix.user_id }}
      # 1.0.0:
      # - Initial release of techlib container
      # 1.0.1:
      # - Set `from_image` to use lab-base container rev 2.6.8
      # 1.0.2:
      # - Set `from_image` to use lab-base container rev 2.6.9
      # 1.0.3:
      # - Set `from_image` to use lab-base container rev 2.6.10
      # 1.0.4:
      # - Set `from_image` to use lab-base container rev 2.6.11
      # 1.0.5:
      # - init_lab.py: raise DEFAULT_PER_NODE_TIMEOUT from 420s (7 min) to 600s (10 min)
      container_revision: "1.0.5"
